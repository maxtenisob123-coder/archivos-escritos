
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo de Mundos | Studio de Autor</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

    <style>
        /* PALETA DE COLORES (Agencia / Ejecutivo) */
        :root {
            --bg-main: #fdfaf1; --bg-panel: #ffffff; --border: #f9b17a;  
            --input-bg: #e8ebf0; --text-main: #2d3250; --text-sub: #707793;     
            --accent: #f9b17a; --text-btn: #2d3250; --shadow: rgba(249, 177, 122, 0.15); 
        }

        body.dark-mode {
            --bg-main: #1a1d2e; --bg-panel: #2d3250; --border: #424769;  
            --input-bg: #424769; --text-main: #ffffff; --text-sub: #c0c5d1;     
            --accent: #f9b17a; --text-btn: #2d3250; --shadow: rgba(0, 0, 0, 0.4); 
        }

        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Raleway', sans-serif; margin: 0; transition: all 0.4s ease; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* PANTALLA DE ACCESO */
        #login-section { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .login-card { background-color: var(--bg-panel); border: 2px solid var(--border); border-radius: 15px; padding: 40px 30px; text-align: center; box-shadow: 0 10px 30px var(--shadow); width: 100%; max-width: 400px; }
        .login-input { width: 100%; padding: 15px; margin-bottom: 15px; background-color: var(--input-bg); border: none; border-radius: 8px; color: var(--text-main); font-size: 1rem; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 15px; background-color: var(--accent); color: var(--text-btn); border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { transform: translateY(-2px); filter: brightness(1.05); }

        /* INTERFAZ PRINCIPAL */
        #app-section { display: flex; height: 100vh; width: 100%; }
        #sidebar { width: 280px; background-color: var(--bg-panel); border-right: 2px solid var(--border); display: flex; flex-direction: column; padding-top: 20px; overflow-y: auto; }
        .btn-nav { background: transparent; color: var(--text-sub); border: none; padding: 15px 20px; text-align: left; font-size: 1.1rem; cursor: pointer; border-bottom: 1px solid var(--border); font-weight: 600; width: 100%; transition: 0.3s; }
        .btn-nav:hover, .btn-nav.activo { background-color: var(--accent); color: var(--text-btn); }
        #contenido-principal { flex-grow: 1; padding: 40px; overflow-y: auto; background-color: var(--bg-main); }

        /* GRID DE LIBROS Y CAPÍTULOS */
        .grid-tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; margin-top: 20px; }
        .tarjeta-libro { background: var(--bg-panel); border: 1px solid var(--border); border-top: 5px solid var(--accent); border-radius: 10px; padding: 20px; text-align: center; box-shadow: 0 4px 10px var(--shadow); cursor: pointer; transition: transform 0.3s; position: relative; }
        .tarjeta-libro:hover { transform: translateY(-5px); }
        .badge-estado { position: absolute; top: -12px; right: 10px; background: var(--text-main); color: var(--bg-main); padding: 5px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        
        /* EDITOR Y PANELES */
        .panel-modulo { background: var(--bg-panel); padding: 25px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 4px 10px var(--shadow); }
        textarea { width: 100%; background: var(--input-bg); color: var(--text-main); border: none; border-radius: 8px; padding: 20px; font-size: 1.1rem; resize: vertical; min-height: 400px; box-sizing: border-box; font-family: 'Raleway', sans-serif; line-height: 1.6; }
        .input-titulo { width: 100%; background: transparent; border: none; border-bottom: 2px dashed var(--text-sub); color: var(--text-main); font-size: 2rem; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; font-family: 'Raleway', sans-serif; }
        .input-titulo:focus { outline: none; border-color: var(--accent); }
        
        /* SELECTORES */
        .select-estado { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); padding: 8px; border-radius: 5px; font-weight: bold; font-family: 'Raleway', sans-serif; outline: none; }
        .theme-switch-wrapper { position: absolute; top: 20px; right: 20px; }
        .theme-select { padding: 8px; border-radius: 20px; border: 2px solid var(--accent); background: var(--bg-panel); color: var(--text-main); cursor: pointer; outline: none; }
    </style>
</head>
<body>

    <div class="theme-switch-wrapper">
        <select class="theme-select" id="theme-selector" onchange="cambiarTema(this.value)">
            <option value="light">Modo Claro (Agencia)</option>
            <option value="dark">Modo Oscuro (Ejecutivo)</option>
        </select>
    </div>

    <div id="login-section">
        <div class="login-card">
            <h1>Studio de Autor</h1>
            <p>Conectado a la Nube</p>
            <input type="text" id="user-input" class="login-input" placeholder="Usuario">
            <input type="password" id="pass-input" class="login-input" placeholder="Contraseña">
            <button class="btn-submit" onclick="intentarLogin()">Acceder a la Biblioteca</button>
            <p id="loading-msg" class="hidden" style="color:var(--accent); margin-top:15px; font-weight:bold;">Sincronizando datos...</p>
        </div>
    </div>

    <div id="app-section" class="hidden">
        
        <div id="sidebar">
            <div style="padding: 20px; text-align: center; border-bottom: 1px solid var(--border);">
                <h2 style="margin: 0; color: var(--text-main);">Archivo</h2>
                <span id="sub-sidebar" style="color: var(--accent); font-size: 0.9rem; font-weight: bold;">Lobby Principal</span>
            </div>
            
            <div id="contenido-sidebar">
                </div>
            
            <div style="margin-top: auto; padding: 15px;">
                <button id="btn-gestion-usuarios" onclick="abrirGestionUsuarios()" class="btn-submit hidden" style="width:100%; font-size: 0.9rem; margin-bottom: 10px;">Gestión de Usuarios</button>
                <button onclick="location.reload()" class="btn-submit" style="width:100%; font-size: 0.9rem; background: #444; color: white;">Cerrar Sesión</button>
            </div>
        </div>
        
        <div id="contenido-principal">
            
            <div id="vista-inicio">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <h1 style="margin: 0;">Mis Proyectos Literarios</h1>
                    <button class="btn-submit" style="width: auto; padding: 10px 20px;" onclick="crearNuevoLibro()">+ Nuevo Libro</button>
                </div>
                <div id="grid-libros" class="grid-tarjetas">
                    </div>
            </div>

            <div id="vista-libro" class="hidden">
                <div class="panel-modulo" style="position: relative;">
                    <input type="text" id="input-titulo-libro" class="input-titulo" onchange="guardarCambiosLibro()">
                    
                    <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                        <div>
                            <span style="color: var(--text-sub); font-size: 0.9rem;">Estado:</span>
                            <select id="select-estado" class="select-estado" onchange="guardarCambiosLibro()">
                                <option value="Escribiéndose">📝 Escribiéndose</option>
                                <option value="Publicándose">🚀 Publicándose</option>
                                <option value="Terminada">✅ Terminada</option>
                                <option value="Pausada">⏸️ Pausada</option>
                                <option value="Abandonada">💀 Abandonada</option>
                            </select>
                        </div>
                        <div style="background: var(--input-bg); padding: 8px 15px; border-radius: 5px; font-weight: bold;">
                            Índice: <span id="contador-capitulos" style="color: var(--accent);">0</span> Capítulos
                        </div>
                        <button class="btn-submit" style="width: auto; padding: 8px 15px; margin-left: auto;" onclick="abrirPersonajes()">Fichas de Personajes</button>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 40px; border-bottom: 2px solid var(--border); padding-bottom: 10px;">
                    <h2 style="margin: 0;">Índice de Capítulos</h2>
                    <button class="btn-submit" style="width: auto; padding: 8px 15px;" onclick="crearNuevoCapitulo()">+ Agregar Capítulo</button>
                </div>
                
                <div id="grid-capitulos" class="grid-tarjetas">
                    </div>
            </div>

            <div id="vista-editor" class="hidden">
                <div class="panel-modulo">
                    <input type="text" id="input-titulo-editor" class="input-titulo" onchange="guardarEditor()">
                    
                    <div style="background: var(--input-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px;">
                        <span style="font-weight: bold; color: var(--accent);">📂 Importar desde Word (.docx):</span>
                        <input type="file" id="upload-word" accept=".docx" style="color: var(--text-main);" onchange="leerWord(event)">
                        <span style="font-size: 0.8rem; color: var(--text-sub);">(El texto reemplazará lo que esté escrito abajo)</span>
                    </div>

                    <textarea id="texto-contenido" onchange="guardarEditor()" placeholder="Comienza a redactar tu historia aquí..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-usuarios" class="hidden" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--bg-panel); padding:30px; border:2px solid var(--accent); z-index:200; width:350px; border-radius:10px; box-shadow: 0 10px 30px var(--shadow);">
        <h3 style="color:var(--text-main); margin-top:0;">Panel de Administrador</h3>
        <div id="lista-usuarios" style="max-height: 150px; overflow-y: auto; margin-bottom: 15px; color:var(--text-main);"></div>
        <hr style="border:0.5px solid var(--text-sub); margin-bottom: 15px;">
        <input type="text" id="new-u" class="login-input" placeholder="Nuevo Usuario" style="padding:10px;">
        <input type="password" id="new-p" class="login-input" placeholder="Nueva Contraseña" style="padding:10px;">
        <button class="btn-submit" onclick="crearUsuario()" style="width:100%">Dar de Alta</button>
        <button class="btn-submit" onclick="document.getElementById('modal-usuarios').classList.add('hidden')" style="background:#444; width:100%; margin-top:5px; color:white;">Cerrar</button>
    </div>

    <script>
        /* --- TEMA --- */
        function cambiarTema(tema) {
            if (tema === 'dark') document.body.classList.add('dark-mode');
            else document.body.classList.remove('dark-mode');
            localStorage.setItem('temaEscritura', tema);
        }
        document.addEventListener('DOMContentLoaded', () => {
            const temaGuardado = localStorage.getItem('temaEscritura') || 'light';
            document.getElementById('theme-selector').value = temaGuardado;
            cambiarTema(temaGuardado);
        });

        /* --- FIREBASE --- */
        const firebaseConfig = {
            apiKey: "AIzaSyBJVIlqlaDPcIld5-Zdf1J8rusx3rp_nZc",
            authDomain: "miarchivopersonal-dc922.firebaseapp.com",
            databaseURL: "https://miarchivopersonal-dc922-default-rtdb.firebaseio.com",
            projectId: "miarchivopersonal-dc922",
            storageBucket: "miarchivopersonal-dc922.firebasestorage.app",
            messagingSenderId: "90845882531",
            appId: "1:90845882531:web:a91b141d9233107ccff716"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let dbLocal = null;
        let lIdx = null; // Índice del Libro
        let cIdx = null; // Índice del Capítulo
        let esPersonajes = false; // Bandera para saber si editamos personajes

        /* --- LOGIN --- */
        function intentarLogin() {
            const u = document.getElementById('user-input').value;
            const p = document.getElementById('pass-input').value;
            document.getElementById('loading-msg').classList.remove('hidden');
            
            database.ref('plataforma_libros/').once('value').then((snapshot) => {
                dbLocal = snapshot.val();
                
                if (!dbLocal) {
                    dbLocal = { 
                        usuarios: [{u: "admin", p: "1234"}],
                        libros: [
                            { 
                                titulo: "El Polen de la Raíz", 
                                estado: "Escribiéndose", 
                                personajes: "Protagonista: 28 años, ex-barista originario de Tlaxcala...", 
                                capitulos: [{ titulo: "Prólogo: La Raíz", contenido: "" }] 
                            }
                        ]
                    };
                }

                if(dbLocal.usuarios.find(user => user.u === u && user.p === p)) {
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('app-section').classList.remove('hidden');
                    if(u === "admin") document.getElementById('btn-gestion-usuarios').classList.remove('hidden');
                    abrirLobby();
                } else { 
                    alert("Usuario o contraseña incorrectos."); 
                    document.getElementById('loading-msg').classList.add('hidden');
                }
            });
        }

        /* --- NAVEGACIÓN Y SIDEBAR --- */
        function abrirLobby() {
            document.getElementById('vista-libro').classList.add('hidden');
            document.getElementById('vista-editor').classList.add('hidden');
            document.getElementById('vista-inicio').classList.remove('hidden');
            
            document.getElementById('sub-sidebar').innerText = "Lobby Principal";
            
            // Sidebar para el Lobby
            const side = document.getElementById('contenido-sidebar');
            side.innerHTML = `<button class="btn-nav activo">📚 Mis Proyectos</button>`;
            
            // Renderizar Libros en el Centro
            const grid = document.getElementById('grid-libros');
            grid.innerHTML = '';
            if(dbLocal.libros) {
                dbLocal.libros.forEach((l, i) => {
                    const totalCapitulos = l.capitulos ? l.capitulos.length : 0;
                    grid.innerHTML += `
                        <div class="tarjeta-libro" onclick="abrirLibro(${i})">
                            <span class="badge-estado">${l.estado || 'En progreso'}</span>
                            <h2 style="margin: 20px 0 10px 0;">${l.titulo}</h2>
                            <p style="color: var(--text-sub); font-size: 0.9rem;">${totalCapitulos} Capítulos</p>
                            <button class="btn-submit" style="margin-top: 15px; padding: 10px;">Gestionar Obra →</button>
                        </div>
                    `;
                });
            }
        }

        function abrirLibro(idx) {
            lIdx = idx;
            const libro = dbLocal.libros[idx];
            
            document.getElementById('vista-inicio').classList.add('hidden');
            document.getElementById('vista-editor').classList.add('hidden');
            document.getElementById('vista-libro').classList.remove('hidden');
            
            // Cargar datos del libro
            document.getElementById('input-titulo-libro').value = libro.titulo;
            document.getElementById('select-estado').value = libro.estado || "Escribiéndose";
            document.getElementById('contador-capitulos').innerText = libro.capitulos ? libro.capitulos.length : 0;
            
            // Actualizar Sidebar para mostrar índice
            document.getElementById('sub-sidebar').innerText = libro.titulo;
            const side = document.getElementById('contenido-sidebar');
            side.innerHTML = `<button class="btn-nav" style="background:#444; color:white;" onclick="abrirLobby()">← Volver al Lobby</button>`;
            side.innerHTML += `<button class="btn-nav" style="border-left: 4px solid var(--accent);" onclick="abrirPersonajes()">👤 Fichas de Personajes</button>`;
            
            if(libro.capitulos) {
                libro.capitulos.forEach((c, i) => {
                    side.innerHTML += `<button class="btn-nav" onclick="abrirEditor(${i})">📄 ${c.titulo}</button>`;
                });
            }

            // Renderizar capítulos en la cuadrícula central
            const grid = document.getElementById('grid-capitulos');
            grid.innerHTML = '';
            if(libro.capitulos) {
                libro.capitulos.forEach((c, i) => {
                    const preview = c.contenido ? c.contenido.substring(0, 60) + '...' : 'Capítulo en blanco...';
                    grid.innerHTML += `
                        <div class="tarjeta-libro" style="border-top-color: var(--text-sub);" onclick="abrirEditor(${i})">
                            <h3 style="margin-top: 0;">${c.titulo}</h3>
                            <p style="color: var(--text-sub); font-size: 0.8rem; font-style: italic;">"${preview}"</p>
                        </div>
                    `;
                });
            }
        }

        /* --- ACCIONES DE LIBRO --- */
        function crearNuevoLibro() {
            const titulo = prompt("Nombre de la nueva obra:");
            if(titulo) {
                if(!dbLocal.libros) dbLocal.libros = [];
                dbLocal.libros.push({ titulo: titulo, estado: "Escribiéndose", personajes: "", capitulos: [] });
                guardarEnNube();
                abrirLobby();
            }
        }

        function guardarCambiosLibro() {
            dbLocal.libros[lIdx].titulo = document.getElementById('input-titulo-libro').value;
            dbLocal.libros[lIdx].estado = document.getElementById('select-estado').value;
            guardarEnNube();
            abrirLibro(lIdx); // Refrescar vista
        }

        /* --- EDITOR DE TEXTO Y WORD --- */
        function abrirPersonajes() {
            esPersonajes = true;
            mostrarEditor("Fichas de Personajes y Mundo", dbLocal.libros[lIdx].personajes || "");
        }

        function crearNuevoCapitulo() {
            if(!dbLocal.libros[lIdx].capitulos) dbLocal.libros[lIdx].capitulos = [];
            const numero = dbLocal.libros[lIdx].capitulos.length + 1;
            dbLocal.libros[lIdx].capitulos.push({ titulo: `Capítulo ${numero}`, contenido: "" });
            guardarEnNube();
            abrirLibro(lIdx);
        }

        function abrirEditor(idx) {
            esPersonajes = false;
            cIdx = idx;
            const cap = dbLocal.libros[lIdx].capitulos[idx];
            mostrarEditor(cap.titulo, cap.contenido);
        }

        function mostrarEditor(titulo, contenido) {
            document.getElementById('vista-libro').classList.add('hidden');
            document.getElementById('vista-editor').classList.remove('hidden');
            
            document.getElementById('input-titulo-editor').value = titulo;
            document.getElementById('texto-contenido').value = contenido;
            
            // Botón de Volver en Sidebar
            document.getElementById('contenido-sidebar').innerHTML = `<button class="btn-nav" style="background:#444; color:white;" onclick="abrirLibro(${lIdx})">← Guardar y Volver a ${dbLocal.libros[lIdx].titulo}</button>`;
        }

        function guardarEditor() {
            const tituloNuevo = document.getElementById('input-titulo-editor').value;
            const contenidoNuevo = document.getElementById('texto-contenido').value;

            if(esPersonajes) {
                dbLocal.libros[lIdx].personajes = contenidoNuevo;
            } else {
                dbLocal.libros[lIdx].capitulos[cIdx].titulo = tituloNuevo;
                dbLocal.libros[lIdx].capitulos[cIdx].contenido = contenidoNuevo;
            }
            guardarEnNube();
        }

        // --- LECTURA DE ARCHIVOS WORD (.docx) ---
        function leerWord(event) {
            const file = event.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(loadEvent) {
                const arrayBuffer = loadEvent.target.result;
                // Usamos Mammoth.js para extraer el texto crudo
                mammoth.extractRawText({arrayBuffer: arrayBuffer})
                    .then(function(result) {
                        const textoExtraido = result.value;
                        document.getElementById('texto-contenido').value = textoExtraido;
                        guardarEditor(); // Guardamos automáticamente en Firebase
                        alert("✅ Documento Word importado con éxito.");
                        document.getElementById('upload-word').value = ""; // Limpiar input
                    })
                    .catch(function(err) {
                        console.log(err);
                        alert("Error al leer el archivo Word. Asegúrate de que sea formato .docx");
                    });
            };
            reader.readAsArrayBuffer(file);
        }

        /* --- GUARDADO EN NUBE --- */
        function guardarEnNube() {
            database.ref('plataforma_libros/').set(dbLocal).then(() => {
                console.log("Sincronizado con Firebase.");
            });
        }

        /* --- GESTIÓN DE USUARIOS (Igual) --- */
        function abrirGestionUsuarios() { document.getElementById('modal-usuarios').classList.remove('hidden'); actualizarListaUsuarios(); }
        function actualizarListaUsuarios() {
            document.getElementById('lista-usuarios').innerHTML = dbLocal.usuarios.map((user, i) => `
                <div style="display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--border);">
                    <span>👤 ${user.u}</span>
                    ${user.u !== "admin" ? `<button onclick="borrarUsuario(${i})" style="background:none; color:#ff4c4c; border:none; cursor:pointer;">[X]</button>` : ''}
                </div>
            `).join('');
        }
        function crearUsuario() {
            const u = document.getElementById('new-u').value; const p = document.getElementById('new-p').value;
            if(u && p) { dbLocal.usuarios.push({u, p}); guardarEnNube(); actualizarListaUsuarios(); }
        }
        function borrarUsuario(i) { if(confirm("¿Eliminar usuario?")) { dbLocal.usuarios.splice(i, 1); guardarEnNube(); actualizarListaUsuarios(); } }
    </script>
</body>
</html>
