

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Virtual | Turismo en la Nube</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        /* MANTENEMOS TU PALETA DE COLORES "TRAVEL AGENCY" */
        :root {
            --bg-main: #fdfaf1; --bg-panel: #ffffff; --border: #f9b17a;  
            --input-bg: #e8ebf0; --text-main: #2d3250; --text-sub: #707793;     
            --accent: #f9b17a; --text-btn: #2d3250; --shadow: rgba(249, 177, 122, 0.15); 
        }

        body.dark-mode {
            --bg-main: #1a1d2e; --bg-panel: #2d3250; --border: #424769;  
            --input-bg: #424769; --text-main: #ffffff; --text-sub: #c0c5d1;     
            --accent: #f9b17a; --text-btn: #2d3250; --shadow: rgba(0, 0, 0, 0.4); 
        }

        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Raleway', sans-serif; margin: 0; transition: all 0.4s ease; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* PANTALLA DE ACCESO */
        #login-section { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .login-card { background-color: var(--bg-panel); border: 2px solid var(--border); border-radius: 15px; padding: 40px 30px; text-align: center; box-shadow: 0 10px 30px var(--shadow); width: 100%; max-width: 400px; }
        .login-input { width: 100%; padding: 15px; margin-bottom: 15px; background-color: var(--input-bg); border: none; border-radius: 8px; color: var(--text-main); font-size: 1rem; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 15px; background-color: var(--accent); color: var(--text-btn); border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }

        /* CAMPUS VIRTUAL */
        #app-section { display: flex; height: 100vh; width: 100%; }
        #sidebar { width: 250px; background-color: var(--bg-panel); border-right: 2px solid var(--border); display: flex; flex-direction: column; padding-top: 20px; overflow-y: auto; }
        .btn-semestre { background: transparent; color: var(--text-sub); border: none; padding: 15px 20px; text-align: left; font-size: 1.1rem; cursor: pointer; border-bottom: 1px solid var(--border); font-weight: 600; }
        .btn-semestre:hover, .btn-semestre.activo { background-color: var(--accent); color: var(--text-btn); }
        #contenido-principal { flex-grow: 1; padding: 30px; overflow-y: auto; background-color: var(--bg-main); }

        /* ELEMENTOS DEL AULA */
        .panel-modulo { background: var(--bg-panel); padding: 25px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 20px; }
        textarea { width: 100%; background: var(--input-bg); color: var(--text-main); border: none; border-radius: 8px; padding: 15px; font-size: 1rem; resize: vertical; min-height: 100px; box-sizing: border-box; font-family: 'Raleway', sans-serif;}
        .materia-card { background: var(--bg-panel); border: 1px solid var(--border); border-top: 5px solid var(--accent); border-radius: 10px; padding: 20px; text-align: center; }
        .grid-materias { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    </style>
</head>
<body>

    <div id="login-section">
        <div class="login-card">
            <h1>Campus Virtual</h1>
            <p>Sincronizado en la Nube</p>
            <input type="text" id="user-input" class="login-input" placeholder="admin">
            <input type="password" id="pass-input" class="login-input" placeholder="1234">
            <button class="btn-submit" onclick="intentarLogin()">Acceder y Sincronizar</button>
            <p id="loading-msg" class="hidden" style="color:var(--accent); margin-top:10px;">Cargando datos desde la nube...</p>
        </div>
    </div>

    <div id="app-section" class="hidden">
        <div id="sidebar">
            <h2 style="text-align:center;">Turismo</h2>
            <button class="btn-semestre activo" onclick="abrirInicio()">🏠 Lobby Principal</button>
            <div id="lista-semestres"></div>
        </div>
        <div id="contenido-principal">
            <div id="vista-inicio">
                <div class="panel-modulo">
                    <h3 style="color: var(--accent);">🎯 Objetivos Profesionales</h3>
                    <textarea id="texto-objetivos" onchange="guardarDatosNube()"></textarea>
                </div>
            </div>

            <div id="vista-semestre" class="hidden">
                <h1 id="titulo-semestre-actual">Semestre</h1>
                <div id="contenedor-materias" class="grid-materias"></div>
            </div>

            <div id="vista-materia" class="hidden">
                <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                    <button onclick="cerrarMateria()" style="padding:10px;">← Volver</button>
                    <h2 id="titulo-materia-activa" style="color:var(--accent);">Materia</h2>
                    <button onclick="guardarDatosNube()" class="btn-submit" style="width:auto; padding:5px 20px;">Guardar en Nube</button>
                </div>
                <div class="panel-modulo">
                    <h3>📝 Apuntes</h3>
                    <textarea id="texto-apuntes" rows="12"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIGURACIÓN FIREBASE (Tus datos de la imagen)
        const firebaseConfig = {
            apiKey: "AIzaSyBJVIlqlaDPcIld5-Zdf1J8rusx3rp_nZc",
            authDomain: "miarchivopersonal-dc922.firebaseapp.com",
            databaseURL: "https://miarchivopersonal-dc922-default-rtdb.firebaseio.com",
            projectId: "miarchivopersonal-dc922",
            storageBucket: "miarchivopersonal-dc922.firebasestorage.app",
            messagingSenderId: "90845882531",
            appId: "1:90845882531:web:a91b141d9233107ccff716"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let dbLocal = null;
        let sIdx = null, mIdx = null;

        // 2. INTENTAR LOGIN Y CARGAR DESDE NUBE
        function intentarLogin() {
            const u = document.getElementById('user-input').value;
            const p = document.getElementById('pass-input').value;

            if(u === "admin" && p === "1234") {
                document.getElementById('loading-msg').classList.remove('hidden');
                
                // Traer datos de Firebase
                database.ref('universidad/').once('value').then((snapshot) => {
                    dbLocal = snapshot.val();
                    
                    // Si la nube está vacía, crear estructura inicial
                    if (!dbLocal) {
                        dbLocal = { objetivos: "", semestres: [] };
                        for (let s = 1; s <= 8; s++) {
                            let materias = [];
                            for (let m = 1; m <= 8; m++) { materias.push({ nombre: `Materia ${m}`, apuntes: "" }); }
                            dbLocal.semestres.push({ num: s, materias: materias });
                        }
                    }
                    
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('app-section').classList.remove('hidden');
                    inicializarApp();
                });
            } else { alert("Error"); }
        }

        function inicializarApp() {
            const lista = document.getElementById('lista-semestres');
            lista.innerHTML = '';
            dbLocal.semestres.forEach((s, i) => {
                lista.innerHTML += `<button class="btn-semestre" onclick="abrirSemestre(${i})">Semestre ${s.num}</button>`;
            });
            document.getElementById('texto-objetivos').value = dbLocal.objetivos;
        }

        function abrirSemestre(idx) {
            sIdx = idx;
            document.getElementById('vista-inicio').classList.add('hidden');
            document.getElementById('vista-materia').classList.add('hidden');
            document.getElementById('vista-semestre').classList.remove('hidden');
            document.getElementById('titulo-semestre-actual').innerText = `Semestre ${idx + 1}`;
            
            const cont = document.getElementById('contenedor-materias');
            cont.innerHTML = '';
            dbLocal.semestres[idx].materias.forEach((m, i) => {
                cont.innerHTML += `
                    <div class="materia-card">
                        <input type="text" value="${m.nombre}" onchange="actualizarNombre(${i}, this.value)" style="width:100%; border:none; text-align:center; font-weight:bold; background:transparent;">
                        <button onclick="entrarMateria(${i})" style="margin-top:10px; width:100%;">Entrar →</button>
                    </div>`;
            });
        }

        function entrarMateria(idx) {
            mIdx = idx;
            document.getElementById('vista-semestre').classList.add('hidden');
            document.getElementById('vista-materia').classList.remove('hidden');
            document.getElementById('titulo-materia-activa').innerText = dbLocal.semestres[sIdx].materias[idx].nombre;
            document.getElementById('texto-apuntes').value = dbLocal.semestres[sIdx].materias[idx].apuntes;
        }

        function actualizarNombre(idx, valor) {
            dbLocal.semestres[sIdx].materias[idx].nombre = valor;
            guardarDatosNube();
        }

        function cerrarMateria() {
            dbLocal.semestres[sIdx].materias[mIdx].apuntes = document.getElementById('texto-apuntes').value;
            guardarDatosNube();
            abrirSemestre(sIdx);
        }

        function abrirInicio() {
            document.getElementById('vista-materia').classList.add('hidden');
            document.getElementById('vista-semestre').classList.add('hidden');
            document.getElementById('vista-inicio').classList.remove('hidden');
        }

        // 3. LA MAGIA: GUARDAR EN LA NUBE
        function guardarDatosNube() {
            dbLocal.objetivos = document.getElementById('texto-objetivos').value;
            database.ref('universidad/').set(dbLocal).then(() => {
                console.log("Sincronizado con Google.");
            });
        }
    </script>
</body>
</html>
